[workspace]
resolver = "2"
members = [
    "crates/nav-core",
    "crates/nav-global",
    "crates/nav-local",
    "crates/nav-trajectory",
    "crates/nav-bevy",
    "crates/nav-core/prop-tests",
    "crates/nav-global/prop-tests",
    "crates/nav-local/prop-tests",
    "crates/nav-trajectory/prop-tests",
    "kani",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"

[workspace.dependencies]
# Linear algebra
nalgebra = { version = "0.33", features = ["serde"] }
faer = "0.24"
parry3d = "0.17"

# Optimization
argmin = "0.10"
levenberg-marquardt = "0.7"

# Parallelism
rayon = "1.10"

# Serialization
serde = { version = "1.0", features = ["derive"] }

# Math utilities
glam = "0.29"

# Formal verification
proptest = "1.5"
bevy = "0.15"

# Workspace crates
nav-core = { path = "crates/nav-core" }
nav-global = { path = "crates/nav-global" }
nav-local = { path = "crates/nav-local" }
nav-trajectory = { path = "crates/nav-trajectory" }
nav-bevy = { path = "crates/nav-bevy" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
